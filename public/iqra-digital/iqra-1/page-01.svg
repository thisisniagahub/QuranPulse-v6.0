<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Page Border -->
  <rect x="40" y="40" width="688" height="944" fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Page Title -->
  <text x="384" y="100" text-anchor="middle" font-size="48" font-family="Noto Naskh Arabic, serif" fill="#000000">إقرأ ١</text>
  
  <!-- Subtitle -->
  <text x="384" y="150" text-anchor="middle" font-size="28" font-family="Noto Naskh Arabic, serif" fill="#333333">الحروف الهجائية</text>
  
  <!-- Letters Grid - Row 1 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="280">ا</text>
    <text x="384" y="280">ب</text>
    <text x="588" y="280">ت</text>
  </g>
  
  <!-- Letters Grid - Row 2 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="420">ث</text>
    <text x="384" y="420">ج</text>
    <text x="588" y="420">ح</text>
  </g>
  
  <!-- Letters Grid - Row 3 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="560">خ</text>
    <text x="384" y="560">د</text>
    <text x="588" y="560">ذ</text>
  </g>
  
  <!-- Letters Grid - Row 4 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="700">ر</text>
    <text x="384" y="700">ز</text>
    <text x="588" y="700">س</text>
  </g>
  
  <!-- Page Number -->
  <text x="384" y="850" text-anchor="middle" font-size="24" font-family="Noto Naskh Arabic, serif" fill="#000000">١</text>
  
  <!-- Footer Notice -->
  <text x="384" y="950" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#666666">بهان ڤمبلاجرن حروف هجائية - بوكن مصحف القرآن</text>
</svg>
