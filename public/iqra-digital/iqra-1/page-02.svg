    <text x="384" y="280">ص</text>
    <text x="588" y="280">ض</text>
  </g>
  
  <!-- Row 2 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="420">ط</text>
    <text x="384" y="420">ظ</text>
    <text x="588" y="420">ع</text>
  </g>
  
  <!-- Row 3 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="560">غ</text>
    <text x="384" y="560">ف</text>
    <text x="588" y="560">ق</text>
  </g>
  
  <!-- Row 4 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
