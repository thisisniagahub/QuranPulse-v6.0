<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="40" y="40" width="688" height="944" fill="none" stroke="#000000" stroke-width="2"/>
  
  <text x="384" y="100" text-anchor="middle" font-size="48" font-family="Noto Naskh Arabic, serif" fill="#000000">إقرأ ١</text>
  
  <!-- Letters Grid - Row 1 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="280">ن</text>
    <text x="384" y="280">و</text>
    <text x="588" y="280">ه</text>
  </g>
  
  <!-- Row 2 -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="420">ء</text>
    <text x="384" y="420">ي</text>
    <text x="588" y="420">لا</text>
  </g>
  
  <!-- Reinforcement - Row 3 (Repeat key letters) -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="560">ا</text>
    <text x="384" y="560">ب</text>
    <text x="588" y="560">ت</text>
  </g>
  
  <!-- Row 4 (More reinforcement) -->
  <g font-family="Noto Naskh Arabic, serif" font-size="100" fill="#000000" text-anchor="middle">
    <text x="180" y="700">ج</text>
    <text x="384" y="700">د</text>
    <text x="588" y="700">ر</text>
  </g>
  
  <text x="384" y="850" text-anchor="middle" font-size="24" font-family="Noto Naskh Arabic, serif" fill="#000000">٣</text>
  <text x="384" y="950" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#666666">بهان ڤمبلاجرن حروف هجائية - بوكن مصحف القرآن</text>
</svg>
