    <style>
        .btn-action {

    <script>
        // Web Speech API for Arabic pronunciation
        const synth = window.speechSynthesis;

        // Function to speak Arabic text
        function speakArabic(text) {
            // Cancel any ongoing speech
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; // Saudi Arabic
            utterance.rate = 0.8; // Slower for learning
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            synth.speak(utterance);
        }

        // Add click listeners to all buttons with Arabic text
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.card-btn');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const arabicText = button.querySelector('.font-arabic');
                    if (arabicText) {
                        const text = arabicText.textContent.trim();
                        speakArabic(text);

                        // Visual feedback
                        button.classList.add('ring-2', 'ring-primary');
                        setTimeout(() => {
                            button.classList.remove('ring-2', 'ring-primary');
                        }, 300);
                    }
                });
            });

            // Dark mode toggle (optional)
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
                document.documentElement.classList.add('dark');
            }
        });
    </script>
